[project]
name = "maintenance-resolution-agent"
version = "0.1.0"
description = "Maintenance Resolution Intelligence Agent — Phase 1: classify unclear tenant maintenance complaints into category, urgency, missing information, recommended action, and confidence."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
